# Self-contained macOS release workflow for forks.
#
# Unlike the upstream `create_release.yml` / `cut_new_releases.yml` pipeline
# (which is wired to Warp's private infra: custom runners, Apple Developer ID
# signing, notarization, GCS, Sentry, and cross-repo dispatch), this workflow
# runs entirely on GitHub-hosted runners and needs NO secrets beyond the
# built-in GITHUB_TOKEN.
#
# It builds the open-source `oss` channel of Warp (binary `warp-oss`, app
# `WarpOss`, no Sentry), self-signs the app with ad-hoc signing (no Apple
# certs required), packages a .dmg per architecture, and attaches them to a
# GitHub Release on this fork.
#
# Triggers:
#   * schedule (nightly): the `check` job looks for new commits on the default
#     branch since the most recent release and only cuts a new release (under an
#     auto-generated date-based tag) when there is something new to ship.
#   * push of a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`
#     (always releases under that tag).
#   * manual run from the Actions tab (workflow_dispatch); always builds, and
#     publishes a release under the optional `tag` input (or an auto-generated
#     date-based tag if left blank).
#
# NOTE: the produced .dmg is ad-hoc signed and NOT notarized. On first launch,
# macOS Gatekeeper will require right-click > Open (or
# `xattr -dr com.apple.quarantine /Applications/WarpOss.app`).

name: Fork Release (macOS)

on:
  # Scheduled nightly runs disabled — run manually via workflow_dispatch or by
  # pushing a tag instead.
  # schedule:
  #   # Nightly at 08:00 UTC. The `check` job below short-circuits the (costly)
  #   # macOS build unless the default branch has new commits since the last
  #   # release.
  #   - cron: "0 8 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag to stamp into the build (e.g. v0.1.0). Leave blank to auto-generate a date-based tag."
        required: false
        type: string

# Needed for softprops/action-gh-release to create releases and upload assets.
permissions:
  contents: write

# Avoid overlapping runs (a long build spilling into the next night's run).
concurrency:
  group: fork-release-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The open-source release channel. Drops Sentry and uses the `warp-oss`
  # binary / `WarpOss` app name (see script/macos/bundle).
  CHANNEL: oss

jobs:
  # Cheap gating job: decides whether to cut a release and under what tag.
  #   * tag push / manual dispatch -> always release.
  #   * schedule (nightly) -> release only if there are new commits since the
  #     most recent release.
  check:
    name: Check for new changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history + tags so we can compare HEAD against the last release.
          fetch-depth: 0

      - name: Decide whether to release and compute tag
        id: decide
        # INPUT_TAG is passed via env (not interpolated into the script body) to
        # avoid shell injection from the workflow_dispatch input.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true

          # Resolve the tag to publish under.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            # Date-based tag in the format script/update_plist understands
            # (vN.YYYY.MM.DD.HH.MM.<channel>_NN), so a real version string is
            # stamped into the app's Info.plist instead of the placeholder.
            tag="v0.$(date -u +%Y.%m.%d.%H.%M).oss_00"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # Anything other than the nightly schedule always releases.
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "Triggered by '${GITHUB_EVENT_NAME}'; will release as ${tag}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled run: only release if there are new commits since the most
          # recent release. `gh release list` includes prereleases (the REST
          # releases/latest endpoint does not, and our releases are prereleases).
          last_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [[ -z "${last_tag}" ]]; then
            echo "No existing releases; cutting the first release as ${tag}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha="$(git rev-list -n1 "${last_tag}" 2>/dev/null || true)"
          head_sha="$(git rev-parse HEAD)"
          if [[ -n "${last_sha}" && "${last_sha}" == "${head_sha}" ]]; then
            echo "No new commits since ${last_tag} (${head_sha}); skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since ${last_tag} (${last_sha:-unknown} -> ${head_sha}); cutting release ${tag}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  build_macos:
    name: Build macOS (${{ matrix.dmg_name_suffix }})
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    # macos-26 ships Xcode 26, which prepare_environment pins via setup-xcode
    # (xcode-version: '26'). macos-14 only carries Xcode 15.x–16.x, so that pin
    # fails there with "Could not find Xcode version that satisfied version spec".
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            dmg_name_suffix: arm64
          - arch: x86_64
            dmg_name_suffix: x86_64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Reuse the upstream environment setup. It installs protoc, Node/Corepack,
      # the Rust toolchain cache, and release deps (cargo-about for license
      # generation). The private warp-channel-config SSH step inside this action
      # only runs in warpdotdev/warp-internal, so on a fork it is a safe no-op.
      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_release_deps: true

      # Xcode 16.3+/26 no longer bundle the Metal Toolchain; it is a separately
      # downloadable component. warpui/build.rs compiles .metal shaders via
      # `xcrun metal` at build time, so without this the build panics with
      # "cannot execute tool 'metal' due to missing Metal Toolchain". Runs after
      # prepare_environment so it targets the pinned Xcode 26.
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
        shell: bash

      - name: Ensure rust target is installed
        run: rustup target add ${{ matrix.arch }}-apple-darwin
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build ${{ matrix.arch }} bundle (oss channel, self-signed)
        id: bundle
        run: |
          script/bundle \
            --channel "$CHANNEL" \
            --selfsign \
            --arch ${{ matrix.arch }} \
            --dmg-name-suffix "${{ matrix.dmg_name_suffix }}"
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.check.outputs.tag }}

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WarpOss-${{ matrix.dmg_name_suffix }}
          path: ${{ steps.bundle.outputs.dmg_path }}

      - name: Attach DMG to GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Warp (OSS) ${{ needs.check.outputs.tag }}
          body: |
            Unsigned, un-notarized open-source (`oss` channel) build of Warp for macOS.

            **First launch:** macOS Gatekeeper will block this build. Right-click the app and choose **Open**, or run:
            `xattr -dr com.apple.quarantine /Applications/WarpOss.app`
          draft: false
          prerelease: true
          files: ${{ steps.bundle.outputs.dmg_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
